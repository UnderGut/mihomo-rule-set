name: Build category-ban-ru-onru

# rules/category-ban-ru-onru.mrs = domains of category-ban-ru that resolve to Russian IPs
# (geoip-for-ru-v4). A slim variant for memory-constrained clients (iOS). Weekly: hosting of
# these sites changes slowly, and a full pass is ~23k DNS-over-HTTPS lookups.
on:
  schedule:
    # Monday 08:23 UTC: after the daily "Generate mihomo Rules" (07:17 UTC) refreshed inputs.
    - cron: '23 8 * * 1'
  push:
    branches: [main]
    paths:
      - .github/scripts/ban-ru-onru.py
      - .github/workflows/ban-ru-onru.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

env:
  # keep in sync with generate-rules.yml: .mrs bytes depend on the mihomo version
  MIHOMO_VERSION: v1.19.31
  MIHOMO_SHA256: 04cf9f09671704f839ddbee2e93069dc831a4123a75281e725d1d96ab9ac1afc

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install mihomo ${{ env.MIHOMO_VERSION }}
        run: |
          set -euo pipefail
          asset="mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 \
            -o "$RUNNER_TEMP/$asset" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${asset}"
          echo "${MIHOMO_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          gunzip -c "$RUNNER_TEMP/$asset" > "$RUNNER_TEMP/bin/mihomo"
          chmod +x "$RUNNER_TEMP/bin/mihomo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Resolve and build
        run: python3 .github/scripts/ban-ru-onru.py

      - name: Check rule sets before publishing
        env:
          MIN_RATIO: '60'
        run: bash .github/scripts/check-rules.sh

      - name: Commit and push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- rules/category-ban-ru-onru.mrs
          if git diff --cached --quiet; then
            echo "No changes in rules/category-ban-ru-onru.mrs" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "chore: rebuild category-ban-ru-onru"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          for i in 1 2 3; do
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push -q origin HEAD:main; then
              echo "Published $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::push rejected (attempt $i), rebasing onto fresh main"
            sleep $((i * 10))
            git fetch -q --no-tags origin main
            git rebase -q origin/main || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
          done
          echo "::error::push failed after 3 attempts"
          exit 1
